name = "gravity-slingshot"
main = "src/index.js"
compatibility_date = "2025-10-01"

# One Worker serves both the game and the API, so the whole thing deploys
# with a single `wrangler deploy` to one URL (no CORS, no separate Pages site).
# The client is built into ../client/dist first (see `npm run deploy`).
[assets]
directory = "../client/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# /api/* always runs the Worker code; everything else is a static file.
run_worker_first = ["/api/*"]

[vars]
# Only matters if the client is hosted on another origin. Same-origin needs no CORS.
ALLOWED_ORIGINS = "*"

[[d1_databases]]
binding = "DB"
database_name = "slingshot-db"
# Replace with the id printed by `npx wrangler d1 create slingshot-db`.
# Any value works for local dev (`wrangler dev` uses a local SQLite file).
database_id = "606e925a-4bd4-45d3-aa54-09c654e3b3f4"
